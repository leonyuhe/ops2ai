<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="360" fill="url(#glow)" rx="24"/>
  <!-- 中央 GPU 芯片 -->
  <g transform="translate(165,105)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="url(#chip)"/>
    <rect x="22" y="22" width="106" height="106" rx="10" fill="#0f172a" fill-opacity="0.85"/>
    <text x="75" y="66" font-family="Menlo,monospace" font-size="30" font-weight="bold" fill="#93c5fd" text-anchor="middle">AI</text>
    <text x="75" y="92" font-family="Menlo,monospace" font-size="14" fill="#67e8f9" text-anchor="middle">INFRA</text>
    <!-- 引脚 -->
    <g stroke="#60a5fa" stroke-width="4" stroke-linecap="round">
      <line x1="20" y1="-16" x2="20" y2="0"/><line x1="55" y1="-16" x2="55" y2="0"/>
      <line x1="95" y1="-16" x2="95" y2="0"/><line x1="130" y1="-16" x2="130" y2="0"/>
      <line x1="20" y1="150" x2="20" y2="166"/><line x1="55" y1="150" x2="55" y2="166"/>
      <line x1="95" y1="150" x2="95" y2="166"/><line x1="130" y1="150" x2="130" y2="166"/>
      <line x1="-16" y1="20" x2="0" y2="20"/><line x1="-16" y1="75" x2="0" y2="75"/>
      <line x1="-16" y1="130" x2="0" y2="130"/>
      <line x1="150" y1="20" x2="166" y2="20"/><line x1="150" y1="75" x2="166" y2="75"/>
      <line x1="150" y1="130" x2="166" y2="130"/>
    </g>
  </g>
  <!-- 左侧：服务器（传统运维） -->
  <g transform="translate(28,120)">
    <rect x="0" y="0" width="86" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="34" width="86" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="68" width="86" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="14" cy="13" r="4" fill="#22d3ee"/><circle cx="14" cy="47" r="4" fill="#22d3ee"/><circle cx="14" cy="81" r="4" fill="#f59e0b"/>
    <rect x="30" y="9" width="42" height="8" rx="4" fill="#334155"/>
    <rect x="30" y="43" width="42" height="8" rx="4" fill="#334155"/>
    <rect x="30" y="77" width="42" height="8" rx="4" fill="#334155"/>
  </g>
  <!-- 右侧：上升曲线（AI 成长） -->
  <g transform="translate(360,120)">
    <polyline points="0,95 20,80 40,86 60,55 80,60 92,20" stroke="url(#path)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92" cy="20" r="7" fill="#67e8f9"/>
    <path d="M86 12 L98 8 L94 22 Z" fill="#67e8f9"/>
  </g>
  <!-- 连接线：从服务器到芯片、芯片到曲线 -->
  <path d="M118 180 C 140 180, 140 180, 163 180" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
  <path d="M317 180 C 335 180, 340 180, 358 180" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
  <!-- 底部文字 -->
  <text x="240" y="318" font-family="Menlo,monospace" font-size="17" fill="#7dd3fc" text-anchor="middle">Ops → AI Infra</text>
</svg>
